<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta | Food Store</title>
    <link rel="stylesheet" href="../../../style.css">
</head>

<body class="auth-page">
    <main class="auth-main">
        <section class="auth-card">
            <div class="auth-brand">
                <span class="auth-icon">🍔</span>
                <p>Food Store</p>
            </div>

            <h1>Crear cuenta</h1>

            <p class="auth-description">
                Registrate para comenzar a realizar tus pedidos.
            </p>

            <form id="form" class="auth-form">
                <div class="auth-field">
                    <label for="email">Email</label>

                    <input type="email" id="email" name="email" autocomplete="email" placeholder="example@example.com"
                        required>
                </div>

                <div class="auth-field">
                    <label for="password">Contraseña</label>

                    <input type="password" id="password" name="password" autocomplete="new-password"
                        placeholder="Creá una contraseña" required>
                </div>

                <button type="submit" class="auth-submit">
                    Registrarse
                </button>
            </form>

            <p class="auth-alternative">
                ¿Ya tenés una cuenta?
                <a href="../login/login.html">Iniciá sesión</a>
            </p>
        </section>
    </main>

    <script type="module" src="./registro.ts"></script>
</body>

</html>
