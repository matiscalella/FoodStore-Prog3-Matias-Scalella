<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | Food Store</title>
    <link rel="stylesheet" href="../../../style.css">
</head>

<body class="auth-page">
    <main class="auth-main">
        <section class="auth-card">
            <div class="auth-brand">
                <span class="auth-icon">🍔</span>
                <p>Food Store</p>
            </div>

            <h1>Iniciar sesión</h1>
            <p class="auth-description">
                Ingresá con tu cuenta para acceder a la tienda.
            </p>

            <form id="form" class="auth-form">
                <div class="auth-field">
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="email"
                        placeholder="example@example.com"
                        required
                    >
                </div>

                <div class="auth-field">
                    <label for="password">Contraseña</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        autocomplete="current-password"
                        placeholder="Ingresá tu contraseña"
                        required
                    >
                </div>

                <button type="submit" class="auth-submit">
                    Ingresar
                </button>
            </form>

            <p class="auth-alternative">
                ¿No tenés una cuenta?
                <a href="../registro/registro.html">Registrate</a>
            </p>
        </section>
    </main>

    <script type="module" src="./login.ts"></script>
</body>

</html>
